[project]
name = "enterprise-kb-backend"
version = "0.0.0"
description = "Enterprise knowledge-base agent backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2,<3",
  "psycopg[binary]>=3,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2,<3",
  "pyjwt[crypto]>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "pgvector>=0.3,<1",
  "pdfplumber>=0.11,<1",
  "python-docx>=1.1,<2",
  "markdown-it-py>=3,<5",
  "jieba>=0.42,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
