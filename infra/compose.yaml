name: ${COMPOSE_PROJECT_NAME:-enterprise-kb-agent-local}

services:
  db:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_kb}
      POSTGRES_USER: ${POSTGRES_USER:-kb_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap_m0.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  init:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ../data/runtime:/workspace/data/runtime
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - "python -m app.cli prepare-db && python -m app.cli migrate && python -m app.cli seed"
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../data/runtime:/workspace/data/runtime
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
